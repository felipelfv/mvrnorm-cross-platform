name: mvrnorm cross-platform check

on:
  push:
  workflow_dispatch:

jobs:
  sample:
    name: sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install MASS
        shell: Rscript {0}
        run: install.packages("MASS", repos = "https://cloud.r-project.org")
      - name: Sample
        shell: Rscript {0}
        run: source("sample.R")
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}
          path: result.txt

  compare:
    name: compare platforms
    needs: sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Show values and check agreement
        shell: bash
        run: |
          for f in results/*/result.txt; do
            echo "$(basename "$(dirname "$f")"): $(tr -d '\r' < "$f")"
          done
          n=$(cat results/*/result.txt | tr -d '\r' | sort -u | wc -l | tr -d ' ')
          echo
          if [ "$n" -eq 1 ]; then
            echo "MATCH: all platforms produced the same sample."
          else
            echo "::warning::DIVERGE: $n distinct results across platforms (MASS::mvrnorm is not cross-platform reproducible here)."
          fi
