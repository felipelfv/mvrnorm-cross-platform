name: mvrnorm cross-platform check

on:
  push:
  workflow_dispatch:

jobs:
  sample:
    name: sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - shell: Rscript {0}
        run: install.packages(c("MASS", "mvtnorm"), repos = "https://cloud.r-project.org")
      - run: Rscript sample.R
      - uses: actions/upload-artifact@v4
        with:
          name: result-native-${{ matrix.os }}
          path: result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: draws-native-${{ matrix.os }}
          path: draws.csv

  nix-sample:
    name: nix-sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: rstats-on-nix
      - run: nix-build
      - run: nix-shell --run "Rscript sample.R"
      - uses: actions/upload-artifact@v4
        with:
          name: result-nix-${{ matrix.os }}
          path: result.txt

  compare:
    needs: [sample, nix-sample]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: |
          for set in native nix; do
            echo "######## $set ########"
            for tag in MASS mvtnorm evec1 evec2 evec3 evec4; do
              echo "== $tag =="
              for f in results/result-$set-*/result.txt; do
                echo "  $(basename "$(dirname "$f")" | sed "s/result-$set-//"): $(grep "^$tag " "$f" | tr -d '\r' | cut -d' ' -f2-)"
              done
              n=$(grep -h "^$tag " results/result-$set-*/result.txt | tr -d '\r' | cut -d' ' -f2- \
                  | awk '{for(i=1;i<=NF;i++)printf "%.10g ",$i; print ""}' | sort -u | wc -l)
              [ "$n" -eq 1 ] && echo "  => MATCH" || echo "  => DIVERGE"
            done
          done

  plot:
    needs: sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: draws-native-*
          path: draws
      - run: Rscript plot_densities.R
      - uses: actions/upload-artifact@v4
        with:
          name: density-plot
          path: densities.png
