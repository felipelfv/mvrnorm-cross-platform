name: mvrnorm cross-platform check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sample:
    name: sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install packages
        shell: Rscript {0}
        run: |
          install.packages(
            c("MASS", "mvtnorm", "digest"),
            repos = "https://cloud.r-project.org"
          )

      - name: Sample and fingerprint
        shell: Rscript {0}
        run: source("sample.R")

      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}
          path: result.txt

  compare:
    name: compare platforms
    needs: sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Report and check agreement
        shell: bash
        run: |
          echo "## Per-platform fingerprints" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in results/*/result.txt; do
            echo "=== $f ==="
            cat "$f"
            echo
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Compare each method's digest line across platforms.
          for method in MASS_mvrnorm mvtnorm_rmvnorm mvtnorm_chol; do
            n=$(grep -h "^${method} " results/*/result.txt | tr -d '\r' | awk '{print $2}' | sort -u | wc -l | tr -d ' ')
            if [ "$n" -eq 1 ]; then
              echo "OK   $method: all platforms agree"
            else
              echo "DIFF $method: $n distinct results across platforms"
            fi
          done

          # The headline claim: MASS::mvrnorm is the one that can diverge.
          mass_n=$(grep -h "^MASS_mvrnorm " results/*/result.txt | tr -d '\r' | awk '{print $2}' | sort -u | wc -l | tr -d ' ')
          echo
          if [ "$mass_n" -ne 1 ]; then
            echo "::warning::MASS::mvrnorm output diverges across platforms ($mass_n distinct results) - the eigenvector-sign-flip bug reproduced."
          else
            echo "::notice::MASS::mvrnorm agreed across these runners this time; the divergence is LAPACK-build dependent."
          fi
