name: mvrnorm cross-platform check

on:
  push:
  workflow_dispatch:

jobs:
  sample:
    name: sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c("MASS", "mvtnorm"), repos = "https://cloud.r-project.org")
      - name: BLAS/LAPACK info
        shell: Rscript {0}
        run: |
          si <- sessionInfo()
          cat("platform:", R.version$platform, "\n")
          cat("BLAS:    ", si$BLAS, "\n")
          cat("LAPACK:  ", si$LAPACK, "\n")
          cat("La_library:", La_library(), "\n")
          cat("La_version:", La_version(), "\n")
          print(extSoftVersion()["BLAS"])
      - name: Sample
        shell: Rscript {0}
        run: source("sample.R")
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}
          path: result.txt

  compare:
    name: compare platforms
    needs: sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Show values and check agreement
        shell: bash
        run: |
          for tag in MASS mvtnorm evec1 evec2 evec3 evec4; do
            echo "== $tag =="
            for f in results/*/result.txt; do
              os=$(basename "$(dirname "$f")" | sed 's/^result-//')
              echo "  $os: $(grep "^$tag " "$f" | tr -d '\r' | cut -d' ' -f2-)"
            done
            n=$(grep -h "^$tag " results/*/result.txt | tr -d '\r' | cut -d' ' -f2- \
                | awk '{for(i=1;i<=NF;i++)printf "%.10g ",$i; print ""}' \
                | sort -u | wc -l | tr -d ' ')
            [ "$n" -eq 1 ] && echo "  => MATCH" || echo "  => DIVERGE ($n distinct)"
            echo
          done
