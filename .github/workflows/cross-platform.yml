name: mvrnorm cross-platform check

on:
  push:
  workflow_dispatch:

jobs:
  sample:
    name: sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c("MASS", "mvtnorm"), repos = "https://cloud.r-project.org")
      - name: Sample
        shell: Rscript {0}
        run: source("sample.R")
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}
          path: result.txt

  compare:
    name: compare platforms
    needs: sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Show values and check agreement
        shell: bash
        run: |
          for method in MASS mvtnorm; do
            echo "== $method =="
            for f in results/*/result.txt; do
              os=$(basename "$(dirname "$f")" | sed 's/^result-//')
              echo "  $os: $(grep "^$method " "$f" | tr -d '\r' | cut -d' ' -f2-)"
            done
            n=$(grep -h "^$method " results/*/result.txt | tr -d '\r' | cut -d' ' -f2- | sort -u | wc -l | tr -d ' ')
            if [ "$n" -eq 1 ]; then
              echo "  => MATCH across platforms"
            else
              echo "  => DIVERGE ($n distinct results)"
            fi
            echo
          done
