name: mvrnorm cross-platform check

on:
  push:
  workflow_dispatch:

jobs:
  sample:
    name: sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install packages
        shell: Rscript {0}
        run: install.packages(c("MASS", "mvtnorm"), repos = "https://cloud.r-project.org")
      - name: BLAS/LAPACK info
        shell: Rscript {0}
        run: |
          si <- sessionInfo()
          cat("platform:", R.version$platform, "\n")
          cat("BLAS:    ", si$BLAS, "\n")
          cat("LAPACK:  ", si$LAPACK, "\n")
          cat("La_library:", La_library(), "\n")
          cat("La_version:", La_version(), "\n")
          print(extSoftVersion()["BLAS"])
      - name: Sample
        shell: Rscript {0}
        run: source("sample.R")
      - uses: actions/upload-artifact@v4
        with:
          name: result-native-${{ matrix.os }}
          path: result.txt

  compare:
    name: compare platforms
    needs: sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-native-*
          path: results
      - run: bash compare.sh

  # Same experiment, but R + MASS + mvtnorm pinned identically via Nix (rix).
  # Nix runs natively only on Linux/macOS, so this matrix is x86 vs ARM.
  nix-sample:
    name: nix-sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Generate pinned env with rix
        run: nix-shell -p R rPackages.rix --run "Rscript generate_env.R"
      - name: Build the pinned env
        run: nix-build
      - name: Sample inside the Nix shell
        run: nix-shell default.nix --run "Rscript sample.R"
      - uses: actions/upload-artifact@v4
        with:
          name: result-nix-${{ matrix.os }}
          path: result.txt

  nix-compare:
    name: compare platforms (nix)
    needs: nix-sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-nix-*
          path: results
      - run: bash compare.sh
